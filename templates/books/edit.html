{% extends 'base.html' %}

{% block title %}Editar Livro{% endblock %}

{% block content %}

    <div class="card">
        <h2>Editar Livro</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar alterações</button>
        </form>

        <br>
        <a href="{% url 'books:book' %}">Voltar para os livros</a>
    </div>

{% endblock %}
