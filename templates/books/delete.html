{% extends 'base.html' %}

{% block title %}Excluir Livro{% endblock %}

{% block content %}

    <div class="card">
        <h2>Excluir Livro</h2>

        <p>Tem certeza que deseja excluir o livro <strong>{{ book.title }}</strong>?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Sim, excluir</button>
        </form>

        <br>
        <a href="{% url 'books:book' %}">Cancelar</a>
    </div>

{% endblock %}
