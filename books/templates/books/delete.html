<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excluir Livro</title>
</head>

<body>

    <h1>Excluir Livro</h1>

    <p>
        Tem certeza que deseja excluir o livro
        <strong>{{ book.title }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>

    </form>

    <br>

    <a href="{% url 'books:book' %}">
        Cancelar
    </a>

</body>

</html>
